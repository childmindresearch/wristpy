name: Python Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:


jobs:
  unit:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python_version: ['3.11', '3.12', '3.13', '3.14']
        resolution: [lowest-direct, highest]
    steps:
    - uses: actions/checkout@v7
    - name: Install poetry
      run: pipx install poetry

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python_version }}
        cache: pip

    - name: Install dependencies
      run: |
        poetry env use python
        poetry run pip install uv
        poetry run uv pip install --resolution=${{ matrix.resolution }} .
        poetry install --only dev
      shell: bash
    - name: Diagnosis info
      shell: bash
      run: |
        echo "Pytest executable:"
        poetry run python -c "import shutil; print(shutil.which('pytest'))"
        echo "Pytest module:"
        poetry run python -m pytest --version
        echo "Pytest executable invocation:"
        poetry run pytest --version
    - name: Test run
      id: test-running
      shell: bash
      env:
        PYTHONFAULTHANDLER: '1'
      run: |
        set -x
        echo "Checking pytest configuration"
        poetry run python -m pytest --trace-config --collect-only -vv -s
        echo "Running tests without coverage"
        poetry run python -m pytest \
          --log-level=DEBUG \
          --verbose \
          -s
    - name: Show installed dependencies
      shell: bash
      run: |
        poetry run python -m pip check
        poetry run python -m pip freeze
    - name: Run tests
      id: run-tests
      run: |
        poetry env info
        poetry run python -m pytest \
          --junitxml=pytest.xml \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml:coverage.xml \
          --cov=src \
          --cov=tests \
          --log-level=DEBUG \
          --verbose
      shell: bash
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install poetry
      run: pipx install poetry
    - uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
        cache: poetry
    - name: Install dependencies
      run: |
        poetry install --only dev
    - name: Ruff format
      run: poetry run ruff format --check
    - name: Ruff check
      run: poetry run ruff check

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install poetry
      run: pipx install poetry
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: poetry
    - run: |
        poetry install
        poetry run mypy .
