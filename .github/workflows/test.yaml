name: Python Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:


jobs:
  unit:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python_version: ['3.11', '3.12', '3.13', '3.14']
        resolution: [highest, lowest-direct]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install uv and set Python version
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python_version }}
        enable-cache: true
        version: 0.13.7

    - name: Install dependencies
      shell: bash
      run: |
        if [[ "${{ matrix.resolution }}" == "highest" ]]; then
          uv sync --locked --only-binary --resolution=highest --all-extras --dev
        else
          uv sync --only-binary --resolution=lowest-direct --all-extras --dev
        fi

    - name: Run tests
      id: run-tests
      run: >
        uv run --frozen pytest \
          --junitxml=pytest.xml \
          --cov-report=term-missing:skip-covered \
          --cov-report=xml:coverage.xml \
          --cov=src tests \
          --log-level=DEBUG \
          --verbose
      shell: bash

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python_version == '3.14' && matrix.resolution == 'highest'
      uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group dev

    - name: Ruff format
      run: uv run ruff format --check

    - name: Ruff check
      run: uv run ruff check

  mypy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run mypy
      run: uv run mypy .
